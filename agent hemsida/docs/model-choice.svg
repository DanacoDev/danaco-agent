<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img">
  <title>How the installer picks a local model</title>
  <desc>16 GB or more of discrete VRAM uses qwen3.6:35b-a3b, NVFP4 on a compatible NVIDIA GPU and Q4_K_M otherwise. Less GPU memory with 8 GB of RAM or more uses qwen3.5:9b-q4_K_M. A smaller computer uses the qwen2.5:0.5b CPU failsafe.</desc>
  <defs>
    <marker id="yes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1.4 L9 5 L1 8.6 Z" fill="#ff6b2b"/>
    </marker>
    <marker id="no-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1.4 L9 5 L1 8.6 Z" fill="#6b6b73"/>
    </marker>
  </defs>
  <rect x="400" y="16" width="280" height="52" rx="12" fill="#ffffff" stroke="#e7e4df"/>
  <text x="540" y="48" text-anchor="middle" fill="#080809" font-family="system-ui, Segoe UI, sans-serif" font-size="16" font-weight="600">This computer</text>
  <path d="M540 68 L540 104" fill="none" stroke="#080809" stroke-width="1.5" marker-end="url(#no-arrow)"/>
  <rect x="290" y="112" width="500" height="78" rx="14" fill="#ffffff" stroke="#e7e4df"/>
  <text x="540" y="144" text-anchor="middle" fill="#080809" font-family="system-ui, Segoe UI, sans-serif" font-size="16" font-weight="600">Discrete GPU memory</text>
  <text x="540" y="168" text-anchor="middle" fill="#6b6b73" font-family="system-ui, Segoe UI, sans-serif" font-size="14">16 GB or more?</text>
  <path d="M430 190 L430 224 L270 224 L270 258" fill="none" stroke="#ff6b2b" stroke-width="1.5" marker-end="url(#yes-arrow)"/>
  <path d="M650 190 L650 224 L810 224 L810 258" fill="none" stroke="#6b6b73" stroke-width="1.5" marker-end="url(#no-arrow)"/>
  <text x="348" y="214" fill="#ff6b2b" font-family="system-ui, Segoe UI, sans-serif" font-size="13" font-weight="600">Yes</text>
  <text x="668" y="216" fill="#6b6b73" font-family="system-ui, Segoe UI, sans-serif" font-size="13" font-weight="600">No</text>
  <rect x="60" y="266" width="420" height="78" rx="14" fill="#ffffff" stroke="#e7e4df"/>
  <text x="270" y="298" text-anchor="middle" fill="#080809" font-family="system-ui, Segoe UI, sans-serif" font-size="16" font-weight="600">NVIDIA compute capability</text>
  <text x="270" y="322" text-anchor="middle" fill="#6b6b73" font-family="system-ui, Segoe UI, sans-serif" font-size="14">10.0 or newer?</text>
  <rect x="600" y="266" width="420" height="78" rx="14" fill="#ffffff" stroke="#e7e4df"/>
  <text x="810" y="298" text-anchor="middle" fill="#080809" font-family="system-ui, Segoe UI, sans-serif" font-size="16" font-weight="600">System RAM</text>
  <text x="810" y="322" text-anchor="middle" fill="#6b6b73" font-family="system-ui, Segoe UI, sans-serif" font-size="14">8 GB or more?</text>
  <path d="M180 344 L180 378 L145 378 L145 430" fill="none" stroke="#ff6b2b" stroke-width="1.5" marker-end="url(#yes-arrow)"/>
  <path d="M360 344 L360 378 L395 378 L395 430" fill="none" stroke="#6b6b73" stroke-width="1.5" marker-end="url(#no-arrow)"/>
  <path d="M720 344 L720 378 L685 378 L685 430" fill="none" stroke="#ff6b2b" stroke-width="1.5" marker-end="url(#yes-arrow)"/>
  <path d="M900 344 L900 378 L935 378 L935 430" fill="none" stroke="#6b6b73" stroke-width="1.5" marker-end="url(#no-arrow)"/>
  <text x="154" y="370" fill="#ff6b2b" font-family="system-ui, Segoe UI, sans-serif" font-size="13" font-weight="600">Yes</text>
  <text x="368" y="370" fill="#6b6b73" font-family="system-ui, Segoe UI, sans-serif" font-size="13" font-weight="600">No</text>
  <text x="694" y="370" fill="#ff6b2b" font-family="system-ui, Segoe UI, sans-serif" font-size="13" font-weight="600">Yes</text>
  <text x="908" y="370" fill="#6b6b73" font-family="system-ui, Segoe UI, sans-serif" font-size="13" font-weight="600">No</text>
  <rect x="24" y="438" width="242" height="150" rx="14" fill="#fff1ea" stroke="#ff6b2b"/>
  <text x="145" y="472" text-anchor="middle" fill="#e85d22" font-family="system-ui, Segoe UI, sans-serif" font-size="12" font-weight="600">Compatible NVIDIA</text>
  <text x="145" y="522" text-anchor="middle" fill="#080809" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">qwen3.6:35b-a3b-nvfp4</text>
  <rect x="274" y="438" width="242" height="150" rx="14" fill="#fff1ea" stroke="#ff6b2b"/>
  <text x="395" y="472" text-anchor="middle" fill="#e85d22" font-family="system-ui, Segoe UI, sans-serif" font-size="12" font-weight="600">Other 16 GB GPU</text>
  <text x="395" y="522" text-anchor="middle" fill="#080809" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">qwen3.6:35b-a3b-q4_K_M</text>
  <rect x="564" y="438" width="242" height="150" rx="14" fill="#fff1ea" stroke="#ff6b2b"/>
  <text x="685" y="472" text-anchor="middle" fill="#e85d22" font-family="system-ui, Segoe UI, sans-serif" font-size="12" font-weight="600">8 GB RAM or more</text>
  <text x="685" y="522" text-anchor="middle" fill="#080809" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">qwen3.5:9b-q4_K_M</text>
  <rect x="814" y="438" width="242" height="150" rx="14" fill="#f6f5f3" stroke="#e7e4df"/>
  <text x="935" y="472" text-anchor="middle" fill="#6b6b73" font-family="system-ui, Segoe UI, sans-serif" font-size="12" font-weight="600">CPU failsafe</text>
  <text x="935" y="522" text-anchor="middle" fill="#080809" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">qwen2.5:0.5b</text>
</svg>
