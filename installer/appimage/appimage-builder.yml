version: 1

AppDir:
  path: ./AppDir
  app_info:
    id: se.danaco.agent.setup
    name: Danaco Agent Setup
    icon: danaco-agent-setup
    version: 1.0.45
    exec: usr/bin/danaco-agent-setup
  files:
    include:
      - /usr/bin/python3
      - /usr/lib/python3/dist-packages/gi
      - /usr/lib/python3/dist-packages/pygtkcompat
      - /usr/lib/python3/dist-packages/cairo
      - /usr/lib/python3/dist-packages/gi_cairo.py
      - /usr/lib/python3/dist-packages/_gi_cairo*
      - /usr/lib/python3/dist-packages/_gi*
  apt:
    arch: amd64
    sources:
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ jammy main universe
      - sourceline: deb http://archive.ubuntu.com/ubuntu/ jammy-updates main universe
    include:
      - ca-certificates
      - curl
      - git
      - gir1.2-gtk-4.0
      - policykit-1
      - python3
      - python3-gi
  runtime:
    env:
      PATH: ${APPDIR}/usr/bin:${PATH}
  test:
    fedora:
      image: fedora:40
    ubuntu:
      image: ubuntu:22.04

AppImage:
  arch: x86_64
  update-information: None
